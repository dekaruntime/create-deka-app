# Publishes create-deka-app to npm on v* tags.
#
# No compilation happens here: this package is plain JS. The binary packages it
# will depend on are built by dekaruntime/deka's release and only copied, never
# rebuilt (deka#1091).
name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; setup-node's Node 22 ships an
      # older npm. No secret is involved: npm exchanges this workflow's OIDC
      # identity for a short-lived credential.
      - name: Use an npm that understands trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi

      # The CLI now requires a directory argument and exits non-zero without one,
      # so a bare `node index.js` is a failing smoke test. Run the real suite.
      - name: Test
        run: npm test

      - name: Usage message without arguments
        run: |
          if node index.js > usage.txt 2>&1; then
            echo "::error::create-deka-app with no arguments should exit non-zero"
            exit 1
          fi
          grep -qi 'usage' usage.txt || { echo "::error::expected a usage message"; cat usage.txt; exit 1; }

      # Authenticated by npm trusted publishing (OIDC) on the workflow name,
      # with no stored credential. Provenance is generated automatically for a
      # public package from a public repo, so no extra flag is passed.
      - name: Publish
        run: npm publish --access public

      - name: Read it back from the registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 10); do
            PUBLISHED="$(npm view create-deka-app@"$VERSION" version 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "create-deka-app@$VERSION is live on npm"
              exit 0
            fi
            sleep 15
          done
          echo "::error::create-deka-app@$VERSION did not appear on the registry"
          exit 1
