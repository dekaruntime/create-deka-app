# Runs the test suite on every push and PR. No Rust, no binaries here —
# this package is plain JS, so there is nothing for sccache to cache.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm test
