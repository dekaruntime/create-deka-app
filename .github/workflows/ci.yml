# Runs the test suite on every push and PR. No Rust, no binaries here —
# this package is plain JS, so there is nothing for sccache to cache.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The publish workflows run `npm install -g npm@latest`; CI must test the
      # same npm or it gates a different toolchain than the one that ships.
      - name: Use the same npm the publish workflows use
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm test
